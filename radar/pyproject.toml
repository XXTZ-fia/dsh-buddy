[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "1.0.0"
description = "Six-platform read-only information radar"
requires-python = ">=3.11"
dependencies = ["playwright", "httpx", "PyYAML", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "tzdata"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
radar = "radar.cli:main"
radar-api = "radar.api:main"
radar-worker = "radar.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
