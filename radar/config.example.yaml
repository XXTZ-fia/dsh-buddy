# 模板：无任何真实值。复制为 config.yaml 后按需修改路径与兴趣词。
# 凭证一律不写在这里：模型 Key 读环境变量，登录态只存在浏览器 profile 中。
log_level: INFO
model_base_url: https://api.deepseek.com/chat/completions
model_name: deepseek-chat
interests:
  - AI Agent
  - 开源项目
  - 具身智能
  - 信息雷达
paths:
  outbox: outbox/radar.json
  db: outbox/seen.db
  fixtures: fixtures
  profiles: browser_profiles
  secrets: secrets
limits:
  min_interval_ms: 600
  jitter_ms: 250
  per_source_limit: 20
  timeout_s: 12
  backoff_minutes: [5, 10, 20, 30]
  snapshot_size: 50
  max_items: 5
