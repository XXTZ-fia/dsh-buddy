<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="DSH Buddy 架构：手机通过中继连接电脑，自有服务器额外提供信息雷达">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1015"/>
      <stop offset="1" stop-color="#151924"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C9CFF"/>
      <stop offset="1" stop-color="#9C7CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="60" y="64" fill="#F2F4FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">两种用法，同一条链路</text>
  <text x="60" y="96" fill="#9AA3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15">控制面走中继，数据面优先局域网 / P2P；雷达只挂在自有服务器上。</text>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="250" height="400" rx="34" fill="#171B25" stroke="#2A3142"/>
    <rect x="82" y="184" width="206" height="332" rx="20" fill="#0F1219"/>
    <circle cx="185" cy="167" r="5" fill="#2A3142"/>
    <text x="102" y="222" fill="#E8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600">岸宝 · Android</text>
    <text x="102" y="244" fill="#7F8AA3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">会话 / 工作区 / 审批 / 终端</text>
    <rect x="102" y="268" width="166" height="46" rx="12" fill="#1B2030" stroke="#2A3142"/>
    <text x="116" y="296" fill="#C9D0E2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">我的电脑 · 远程 · 已连接</text>
    <rect x="102" y="330" width="166" height="34" rx="10" fill="#161B27"/>
    <text x="114" y="352" fill="#8E99B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">工作 / 信息雷达 / 我的</text>
    <rect x="102" y="380" width="166" height="118" rx="14" fill="#141926" stroke="#232A3B"/>
    <text x="116" y="406" fill="#E8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">信息雷达</text>
    <text x="116" y="428" fill="#6FD39A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">已连接 · 7/8 来源正常</text>
    <rect x="116" y="442" width="138" height="8" rx="4" fill="#232A3B"/>
    <rect x="116" y="460" width="104" height="8" rx="4" fill="#1D2433"/>
    <rect x="116" y="478" width="122" height="8" rx="4" fill="#1D2433"/>
  </g>
  <text x="185" y="586" fill="#7F8AA3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">手机端</text>

  <!-- Relay -->
  <g filter="url(#shadow)">
    <rect x="470" y="210" width="260" height="290" rx="26" fill="#171B25" stroke="#2A3142"/>
    <rect x="470" y="210" width="260" height="8" rx="4" fill="url(#accent)"/>
    <text x="500" y="262" fill="#E8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700">中继服务器</text>
    <text x="500" y="288" fill="#8E99B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">Control plane</text>
    <rect x="500" y="310" width="200" height="44" rx="10" fill="#1B2030" stroke="#2A3142"/>
    <text x="514" y="337" fill="#C9D0E2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">官方 dsh.r2049.cn</text>
    <text x="500" y="380" fill="#66718A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">或</text>
    <rect x="500" y="396" width="200" height="44" rx="10" fill="#1E2434" stroke="#3A4A72"/>
    <text x="514" y="423" fill="#AFC0EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">你的域名（一键脚本）</text>
    <text x="500" y="470" fill="#7F8AA3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">账号 / 设备 / 在线状态</text>
  </g>
  <text x="600" y="516" fill="#7F8AA3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">只转发，不读会话内容</text>

  <!-- PC -->
  <g filter="url(#shadow)">
    <rect x="880" y="150" width="270" height="400" rx="22" fill="#171B25" stroke="#2A3142"/>
    <rect x="900" y="186" width="230" height="300" rx="10" fill="#0F1219" stroke="#232A3B"/>
    <text x="918" y="222" fill="#E8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">DSH 桌面端</text>
    <text x="918" y="244" fill="#7F8AA3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">ds-harness-remote 插件</text>
    <rect x="918" y="264" width="194" height="30" rx="8" fill="#1B2030"/>
    <text x="930" y="284" fill="#9AA3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">会话 · 工具 · ACP 后端</text>
    <rect x="918" y="306" width="194" height="30" rx="8" fill="#1B2030"/>
    <text x="930" y="326" fill="#9AA3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">工作区文件 / 终端 / 审批</text>
    <rect x="918" y="352" width="194" height="110" rx="12" fill="#141926" stroke="#232A3B"/>
    <text x="932" y="378" fill="#E8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">让电脑常驻</text>
    <text x="932" y="400" fill="#7F8AA3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10">关掉窗口也不掉线</text>
    <rect x="932" y="416" width="164" height="8" rx="4" fill="#232A3B"/>
    <rect x="932" y="434" width="120" height="8" rx="4" fill="#1D2433"/>
    <rect x="932" y="452" width="140" height="8" rx="4" fill="#1D2433"/>
  </g>
  <text x="1015" y="586" fill="#7F8AA3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">电脑端</text>

  <!-- connections -->
  <g stroke="#5B6C96" stroke-width="2" fill="none">
    <path d="M310 330 C 380 330, 400 330, 470 330" stroke-dasharray="6 6"/>
    <path d="M730 330 C 800 330, 820 330, 880 330" stroke-dasharray="6 6"/>
  </g>
  <text x="390" y="316" fill="#8FA6E0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">WebSocket</text>
  <text x="760" y="316" fill="#8FA6E0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">WebSocket</text>

  <!-- radar callout -->
  <g>
    <rect x="470" y="540" width="260" height="46" rx="12" fill="#1A2233" stroke="#33456E"/>
    <circle cx="494" cy="563" r="5" fill="#7C9CFF"/>
    <text x="510" y="568" fill="#B9C6E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">自有服务器额外提供信息雷达</text>
  </g>
</svg>
